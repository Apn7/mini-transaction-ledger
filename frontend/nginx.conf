# nginx serves the built Angular files and forwards API calls to the backend.
# Because the browser only ever talks to this one server, the same-origin rule is never
# triggered and no CORS configuration is needed anywhere in the project.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Anything under /api goes to the backend container.
    # "backend" is the service name in docker-compose.yml; Docker resolves it to that container.
    location /api/ {
        proxy_pass http://backend:8080;

        # Pass the original request details through, so the backend can log who really called.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular is a single-page app: the server only has index.html, and the app decides
    # what to show. Without this, refreshing on any route would return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
