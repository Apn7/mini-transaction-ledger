spring.application.name=ledger

# Connection details come from the environment, with local defaults after the ":".
# Docker Compose supplies the real values; running on the host falls back to localhost:5433.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ledger}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ledger}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ledger}

# Never let Hibernate create or alter tables. Schema changes belong in migrations,
# which are reviewable and repeatable. "validate" only checks that entities match the schema.
spring.jpa.hibernate.ddl-auto=validate

# Close the database session when the service method ends, not when the HTTP response is
# written. Keeps database work inside the transaction where it belongs.
spring.jpa.open-in-view=false
